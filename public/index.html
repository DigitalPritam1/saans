<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Saans (साँस) - Calm, clinical-grade environmental air quality and winter smog protection assistant for Indian families.">
  <meta name="theme-color" content="#0F766E" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#090D16" media="(prefers-color-scheme: dark)">

  <!-- Open Graph / Twitter Meta Tags -->
  <meta property="og:title" content="Saans (साँस) - Air Quality & Smog Assistant">
  <meta property="og:description" content="Protect your family during winter smog with verified diurnal routines, indoor hacks, and transparent impact metrics.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">

  <title>Saans (साँस) - Clean Air & Smog Assistant</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Accessibility: Skip Link -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Header & Desktop Navigation -->
  <header class="app-header">
    <div class="header-container">
      <a href="#home" class="brand-wrap" aria-label="Saans Home">
        <svg class="brand-logo-svg" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="var(--color-accent)"/>
          <path d="M6 18c3.5-6 8-6 11.5-2s6.5 4 10.5-2" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="brand-text-col">
          <span class="brand-name">Saans</span>
          <span class="brand-hindi">साँस</span>
        </div>
      </a>

      <!-- Desktop Segmented Navigation -->
      <nav class="desktop-nav" role="tablist" aria-label="Main Navigation">
        <button
          type="button"
          class="nav-tab-btn active-tab"
          id="desktop-tab-home"
          data-tab-target="home"
          role="tab"
          aria-selected="true"
          aria-controls="pane-home"
          tabindex="0"
        >
          Home
        </button>
        <button
          type="button"
          class="nav-tab-btn"
          id="desktop-tab-plan"
          data-tab-target="plan"
          role="tab"
          aria-selected="false"
          aria-controls="pane-plan"
          tabindex="-1"
        >
          Today's Plan
        </button>
        <button
          type="button"
          class="nav-tab-btn"
          id="desktop-tab-indoor"
          data-tab-target="indoor"
          role="tab"
          aria-selected="false"
          aria-controls="pane-indoor"
          tabindex="-1"
        >
          Indoor Hacks
        </button>
        <button
          type="button"
          class="nav-tab-btn"
          id="desktop-tab-ask"
          data-tab-target="ask"
          role="tab"
          aria-selected="false"
          aria-controls="pane-ask"
          tabindex="-1"
        >
          Ask Saans
        </button>
        <button
          type="button"
          class="nav-tab-btn"
          id="desktop-tab-impact"
          data-tab-target="impact"
          role="tab"
          aria-selected="false"
          aria-controls="pane-impact"
          tabindex="-1"
        >
          Impact
        </button>
      </nav>

      <!-- Actions -->
      <div class="header-actions">
        <button
          type="button"
          class="btn-header-action btn-city-trigger"
          id="btn-header-city"
          aria-label="Change city"
        >
          <svg class="icon icon-map-pin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#icon-map-pin"></use></svg>
          <span id="header-city-name">Delhi NCR</span>
        </button>

        <button
          type="button"
          class="btn-header-action btn-open-household"
          aria-label="Open My Household Settings"
        >
          <svg class="icon icon-users" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#icon-users"></use></svg>
          <span class="sr-only">My Household</span>
        </button>

        <button
          type="button"
          class="btn-header-action"
          id="btn-theme-toggle"
          aria-label="Toggle dark mode"
        >
          <svg class="icon icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#icon-moon"></use></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main View Area -->
  <main id="main-content" class="main-content" tabindex="-1">
    <section id="pane-home" class="tab-pane active-pane" role="tabpanel" aria-labelledby="desktop-tab-home" tabindex="0"></section>
    <section id="pane-plan" class="tab-pane" role="tabpanel" aria-labelledby="desktop-tab-plan" tabindex="0"></section>
    <section id="pane-indoor" class="tab-pane" role="tabpanel" aria-labelledby="desktop-tab-indoor" tabindex="0"></section>
    <section id="pane-ask" class="tab-pane" role="tabpanel" aria-labelledby="desktop-tab-ask" tabindex="0"></section>
    <section id="pane-impact" class="tab-pane" role="tabpanel" aria-labelledby="desktop-tab-impact" tabindex="0"></section>
  </main>

  <!-- Quiet App Footer -->
  <footer class="app-footer">
    <div class="footer-container">
      <p class="footer-disclaimer">Not medical advice. Environmental and personal exposure estimates are for guidance only. Consult a doctor for medical symptoms.</p>
      <div class="footer-meta">
        <span>Your household profile stays on this device</span>
        <span class="footer-dot" aria-hidden="true">·</span>
        <span>Sources: Google Air Quality API, Gemini</span>
        <span class="footer-dot" aria-hidden="true">·</span>
        <span>&copy; 2026 Saans</span>
      </div>
    </div>
  </footer>

  <!-- Mobile Bottom Navigation Bar (56px) -->
  <nav class="mobile-nav-bar" role="tablist" aria-label="Mobile Navigation">
    <button
      type="button"
      class="mobile-nav-item active-tab"
      id="mobile-tab-home"
      data-tab-target="home"
      role="tab"
      aria-selected="true"
      aria-controls="pane-home"
      tabindex="0"
    >
      <svg class="icon icon-house" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#icon-house"></use></svg>
      <span>Home</span>
    </button>
    <button
      type="button"
      class="mobile-nav-item"
      id="mobile-tab-plan"
      data-tab-target="plan"
      role="tab"
      aria-selected="false"
      aria-controls="pane-plan"
      tabindex="-1"
    >
      <svg class="icon icon-calendar-clock" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#icon-calendar-clock"></use></svg>
      <span>Plan</span>
    </button>
    <button
      type="button"
      class="mobile-nav-item"
      id="mobile-tab-indoor"
      data-tab-target="indoor"
      role="tab"
      aria-selected="false"
      aria-controls="pane-indoor"
      tabindex="-1"
    >
      <svg class="icon icon-lightbulb" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#icon-lightbulb"></use></svg>
      <span>Indoor</span>
    </button>
    <button
      type="button"
      class="mobile-nav-item"
      id="mobile-tab-ask"
      data-tab-target="ask"
      role="tab"
      aria-selected="false"
      aria-controls="pane-ask"
      tabindex="-1"
    >
      <svg class="icon icon-message-circle" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#icon-message-circle"></use></svg>
      <span>Ask</span>
    </button>
    <button
      type="button"
      class="mobile-nav-item"
      id="mobile-tab-impact"
      data-tab-target="impact"
      role="tab"
      aria-selected="false"
      aria-controls="pane-impact"
      tabindex="-1"
    >
      <svg class="icon icon-chart-column" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#icon-chart-column"></use></svg>
      <span>Impact</span>
    </button>
  </nav>

  <!-- My Household Modal Sheet -->
  <div
    id="household-modal"
    class="household-modal-overlay"
    role="dialog"
    aria-modal="true"
    aria-label="My Household Settings"
    aria-hidden="true"
  ></div>

  <!-- Toast Live Region -->
  <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

  <!-- Core App Module -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
